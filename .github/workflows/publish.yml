name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

# Nothing by default. Each job asks for exactly what it needs.
permissions: {}

jobs:
  # Installs, tests, builds and packs. This job runs every dependency's code
  # (npm ci, the test runner, tsc), so it gets no id-token permission: nothing
  # it runs can mint an npm publish credential. Its only output is the .tgz.
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache anywhere in the release workflow, so a poisoned
      # cache entry cannot reach the tarball that gets published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json ${PKG_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          mkdir -p package-out
          npm pack --pack-destination package-out
          ls -l package-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package-out/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publishes the tarball the build job produced, and nothing else. No checkout,
  # no npm ci, no lifecycle scripts: publishing a .tgz does not run them.
  publish:
    name: Publish (trusted publishing + provenance)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Trusted publishing needs npm 11.5.1 or newer; Node 24 ships it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require npm 11.5.1 or newer
        run: |
          node -e "const v=process.argv[1];const [a,b,c]=v.split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error('npm '+v+' is too old for trusted publishing (needs 11.5.1 or newer)');process.exit(1)}console.log('npm '+v+' ok')" "$(npm --version)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package-out

      # OIDC only: no token in the environment. If this step ever fails with a
      # 403 or 404, check the trusted publisher on the package's npm Settings
      # page: it must name this repository and publish.yml, and allow npm publish.
      - name: Publish with trusted publishing
        run: |
          shopt -s nullglob
          tarballs=(package-out/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found ${#tarballs[@]}"
            exit 1
          fi
          echo "Publishing ${tarballs[0]}"
          npm publish "./${tarballs[0]}" --provenance --access public
