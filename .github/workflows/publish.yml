name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

# id-token: write is what lets the job prove to npm, over OIDC, that it is this
# workflow in this repository. With a trusted publisher configured on the npm
# package (GitHub Actions, evanatpizzarobot/vr-org-mcp, publish.yml), no
# long-lived token is needed and provenance is attached automatically.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish (trusted publishing + provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs Node 22.14 or newer and npm 11.5.1 or newer.
      # No dependency cache in the job that publishes.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Require npm 11.5.1 or newer
        run: |
          node -e "const v=process.argv[1];const [a,b,c]=v.split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error('npm '+v+' is too old for trusted publishing (needs 11.5.1 or newer)');process.exit(1)}console.log('npm '+v+' ok')" "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # OIDC only: no token in the environment. First used for v0.4.3, which
      # validated the trusted publisher. If this step ever fails with a 403 or
      # 404, check the trusted publisher on the package's npm Settings page:
      # it must name this repository and publish.yml, and allow npm publish.
      - name: Publish with trusted publishing
        run: npm publish --provenance --access public
